server.port=8080

# In-memory H2 database (no setup required). The H2 console is available at
# http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:reservations).
spring.datasource.url=jdbc:h2:mem:reservations;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console